# All secrets come from .env (copied from .env.example)
# Never commit a real .env file.

services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medchain}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - ./server:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-http://solana_validator:8899}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      solana_validator:
        condition: service_healthy

  # ── Celery worker (drains the blockchain sync queue) ──────────────────────
  celery_worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4 -Q celery
    volumes:
      - ./server:/app
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-http://solana_validator:8899}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      solana_validator:
        condition: service_healthy

  # ── Celery Beat (triggers flush_pending_syncs every 5 minutes) ───────────
  celery_beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./server:/app
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-http://solana_validator:8899}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      solana_validator:
        condition: service_healthy

  solana_validator:
    image: solanalabs/solana:stable
    restart: unless-stopped
    command:
      - solana-test-validator
      - --reset
      - --ledger
      - /ledger
      - --rpc-bind-address
      - 0.0.0.0
      - --rpc-port
      - "8899"
      - --faucet-port
      - "9900"
      - --limit-ledger-size
    ports:
      - "8899:8899"
      - "9900:9900"
    volumes:
      - solana_ledger:/ledger
    healthcheck:
      test: ["CMD", "solana", "--url", "http://127.0.0.1:8899", "cluster-version"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  static_volume:
  solana_ledger:

