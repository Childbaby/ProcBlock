[package]
name = "vaxchain_trust_layer"
version = "0.1.0"
description = "Anchor program for ZAMMSA custody transfer and batch intake"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vaxchain_trust_layer"

[features]
default = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { workspace = true }
